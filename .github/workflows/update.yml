name: Update Events

# ⚠️ 本檔的正本在公開 repo `JP-study-list/taiwan-events-runner` 的 `.github/workflows/update.yml`，
#    這裡（私有 repo 的 `_runner-template/`）是副本，改一邊要同步另一邊。
# 排程（2026-10-04，單位 F，使用者定案）：每天台灣 06:53。
#    ⚠️ 不可以往前挪進深夜：文化部 API 深夜只回部分資料（私有 repo CLAUDE.md §8 地雷 8）。
#    實測 10-04 03:10 只剩 5%（1,184→60 筆），06:49 已恢復；06:49 是量過「完整」的最早時間，所以排在它之後。
#    GitHub 排程只會延遲、不會提早（實測半夜延遲幾分鐘到四十分鐘、甚至整次跳過），延遲只會落到更安全的時段。
#    避開整點：整點最擠、最容易被跳過。
on:
  workflow_dispatch:
  schedule:
    - cron: "53 22 * * *"    # 每日 06:53 台灣時間（UTC+8）

# runner 自己什麼權限都不需要：取出與推回私有 repo 走的是 TAIWAN_PAT。
permissions: {}

# ⚠️ 日後加上景點／餐廳的 workflow 時，三支要共用這個 group——它們推同一個私有 repo 的 main，
#    撞車時沒有任何警訊。`cancel-in-progress` 不可改成 true：被砍的那一輪什麼都寫不出來。
concurrency:
  group: taiwan-events-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出私有 repo 的程式碼
        uses: actions/checkout@v4
        with:
          repository: JP-study-list/taiwan-events
          token: ${{ secrets.TAIWAN_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取（完整輸出寫進 run.log，不進公開紀錄）
        id: fetch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY:   ${{ secrets.JINA_API_KEY }}
        run: |
          set +e
          python fetch_events.py > run.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 安全摘要（只印統計，絕不印來源名稱）
        if: always()
        run: |
          grep -E '^\[done\]|^\[ja\]|^\[stats\] 模型使用|^\[geo\] 資料庫整體' run.log \
            || echo "(沒有摘要行，詳情請看私有 repo 的 run.log)"

      - name: 把 events.json 與 run.log 推回私有 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json run.log
          if git diff --cached --quiet; then
            echo "無異動"
            exit 0
          fi
          git commit -m "Update events $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台灣時間"
          for i in 1 2 3; do
            if git push; then
              echo "已推回（第 $i 次嘗試）"
              exit 0
            fi
            git pull --rebase origin main || { echo "rebase 失敗"; exit 1; }
          done
          exit 1

      - name: 抓取若失敗，讓這次執行標紅
        if: always() && steps.fetch.outputs.code != '0'
        run: |
          echo "結束碼 ${{ steps.fetch.outputs.code }}，詳情請看私有 repo 的 run.log"
          exit 1
