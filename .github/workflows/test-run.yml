name: Test Run (no write-back)

# ⚠️ 本檔的正本在公開 repo `JP-study-list/taiwan-events-runner` 的 `.github/workflows/test-run.yml`，
#    這裡（私有 repo 的 `_runner-template/`）是副本，改一邊要同步另一邊。
# 試跑（2026-10-04，單位 R-1，使用者選 B「在 GitHub 上測」）：
#   從私有 repo 的指定分支取程式、只跑名稱含 `only` 關鍵字的來源，
#   結果（events.json、run.log）**推到私有 repo 的 `test-output` 分支**，絕不碰 main。
#   - 不用下載檔（artifact）：公開 repo 的下載檔任何登入的人都拿得到，私有資料就白藏了。
#   - commit 訊息帶 `[CF-Pages-Skip]`：Cloudflare Pages 看到它就不建置，不花建置額度。
#   - `test-output` 每次強制覆蓋（只有這個分支），它只放最新一次的試跑結果。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "私有 repo 的分支（測試中的程式）"
        required: true
        default: "r1"
      only:
        description: "只跑名稱含這些關鍵字的來源（逗號分隔）"
        required: true

permissions: {}

concurrency:
  group: taiwan-events-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取出私有 repo 的測試分支
        uses: actions/checkout@v4
        with:
          repository: JP-study-list/taiwan-events
          ref: ${{ inputs.ref }}
          token: ${{ secrets.TAIWAN_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 試跑（完整輸出寫進 run.log，不進公開紀錄）
        id: fetch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY:   ${{ secrets.JINA_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          python -u fetch_events.py --only="$ONLY" > run.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 安全摘要（只印統計）
        if: always()
        run: |
          grep -E '^\[done\]|^\[ja\]|^\[stats\] 模型使用|^\[geo\] 資料庫整體' run.log \
            || echo "(沒有摘要行，詳情請看私有 repo test-output 分支的 run.log)"

      - name: 結果推到私有 repo 的 test-output 分支（不碰 main）
        if: always()
        env:
          REF: ${{ inputs.ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f events.json run.log
          git commit -q -m "test-run from ${REF} $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') [CF-Pages-Skip]"
          git push --force origin HEAD:refs/heads/test-output

      - name: 試跑若失敗，讓這次執行標紅
        if: always() && steps.fetch.outputs.code != '0'
        run: |
          echo "結束碼 ${{ steps.fetch.outputs.code }}"
          exit 1
